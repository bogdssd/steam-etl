services:
  postgres:
    image: postgres:15
    container_name: steam_postgres
    environment:
      POSTGRES_USER: steam
      POSTGRES_PASSWORD: steam
      POSTGRES_DB: steam_dwh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steam"]
      interval: 10s
      retries: 5

  metabase:
    image: metabase/metabase:latest
    container_name: steam_metabase
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  airflow:
    image: apache/airflow:2.7.3-python3.10
    container_name: steam_airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://steam:steam@postgres:5432/steam_dwh
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./logs:/opt/airflow/logs
      - ./raw:/opt/airflow/raw
      - ./tests:/opt/airflow/tests
      - ./pytest.ini:/opt/airflow/pytest.ini
    command: >
      bash -c "pip install requests pandas psycopg2-binary pytest &&
               airflow db init &&
               airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com &&
               airflow scheduler & airflow webserver"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: